<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>smartsheet by Laser Power</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f5bd6'/%3E%3Cpath d='M6 12.5l3.5 3.5L18 7.5' stroke='%23fff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <style>
      #splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,#2f5bd6 0%,#3b46c8 55%,#4a3fc0 100%);font-family:'Manrope',sans-serif;transition:opacity .5s ease}
      #splash.hide{opacity:0;pointer-events:none}
      #splash .row{display:flex;align-items:center;gap:12px}
      #splash .nm{color:#fff;font-weight:700;font-size:40px;letter-spacing:-1px}
      #splash .by{color:rgba(255,255,255,.72);font-weight:500;font-size:13px;letter-spacing:3px;margin-top:8px}
      #splash .bar{margin-top:22px;width:150px;height:2px;background:rgba(255,255,255,.22);border-radius:2px;overflow:hidden}
      #splash .bar i{display:block;height:100%;width:40%;background:#fff;border-radius:2px;animation:sl 1.1s ease-in-out infinite}
      @keyframes sl{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="row">
        <svg width="30" height="30" viewBox="0 0 24 24"><rect x="1" y="1" width="22" height="22" rx="5" fill="#fff"/><path d="M6 12.5l3.5 3.5L18 7.5" stroke="#2f5bd6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="nm">smartsheet</span>
      </div>
      <div class="by">by Laser Power</div>
      <div class="bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script>
      setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(function(){s.remove()},600)}},1800)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
